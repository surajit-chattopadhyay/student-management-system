<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">

</head>


<body>

<h1>Student Management System</h1>

<div class="dashboard">

    <div class="card">
        <h3>Total Students</h3>
        <p id="totalStudents">0</p>
    </div>

</div>

<!-- =========================
     ADD STUDENT
========================== -->

<h2>Add Student</h2>

<form id="studentForm">

    <label for="id">Student ID:</label>
    <input type="number" id="id" required>

    <br><br>

    <label for="name">Name:</label>
    <input type="text" id="name" required>

    <br><br>

    <label for="age">Age:</label>
    <input type="number" id="age" required>

    <br><br>

    <label for="course">Course:</label>
    <input type="text" id="course" required>

    <br><br>

    <label for="marks">Marks:</label>
    <input type="number" id="marks" required>

    <br><br>

    <button type="submit">
        Add Student
    </button>

</form>

<p id="message"></p>


<hr>


<!-- =========================
     VIEW STUDENTS
========================== -->

<h2>Student Records</h2>

<button type="button" onclick="loadStudents()">
    View Students
</button>

<br><br>

<table border="1">

    <thead>

    <tr>

        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Course</th>
        <th>Marks</th>
        <th>Action</th>

    </tr>

    </thead>

    <tbody id="studentTableBody">

    </tbody>

</table>


<hr>


<!-- =========================
     SEARCH STUDENT
========================== -->

<h2>Search Student</h2>

<label for="searchId">Student ID:</label>

<input type="number" id="searchId">

<button type="button" onclick="searchStudent()">
    Search
</button>

<br><br>

<div id="searchResult"></div>


<hr>


<!-- =========================
     UPDATE STUDENT
========================== -->

<h2>Update Student</h2>

<label for="updateId">Student ID:</label>

<input type="number" id="updateId">

<br><br>


<label for="updateName">New Name:</label>

<input type="text" id="updateName">

<br><br>


<label for="updateAge">New Age:</label>

<input type="number" id="updateAge">

<br><br>


<label for="updateCourse">New Course:</label>

<input type="text" id="updateCourse">

<br><br>


<label for="updateMarks">New Marks:</label>

<input type="number" id="updateMarks">

<br><br>


<button type="button" onclick="updateStudent()">
    Update Student
</button>

<p id="updateMessage"></p>


<!-- =========================
     JAVASCRIPT
========================== -->

<script>


    // ==================================
    // ADD STUDENT
    // ==================================

    const form =
        document.getElementById("studentForm");

    const message =
        document.getElementById("message");


    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const student = {

                id: Number(
                    document.getElementById("id").value
                ),

                name:
                document.getElementById("name").value,

                age: Number(
                    document.getElementById("age").value
                ),

                course:
                document.getElementById("course").value,

                marks: Number(
                    document.getElementById("marks").value
                )

            };


            try {

                const response =
                    await fetch("/students", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(student)

                    });


                if (response.ok) {

                    message.textContent =
                        "Student added successfully!";

                    form.reset();

                    loadStudents();

                }

                else {

                    message.textContent =
                        "Failed to add student.";

                }

            }

            catch (error) {

                console.error(error);

                message.textContent =
                    "Something went wrong.";

            }

        }
    );



    // ==================================
    // VIEW STUDENTS
    // ==================================

    async function loadStudents() {

        try {

            const response =
                await fetch("/students");

            const students =
                await response.json();

            document.getElementById("totalStudents").textContent =
                students.length;

            const tableBody =
                document.getElementById(
                    "studentTableBody"
                );

            tableBody.innerHTML = "";


            students.forEach(function (student) {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                <td>${student.id}</td>

                <td>${student.name}</td>

                <td>${student.age}</td>

                <td>${student.course}</td>

                <td>${student.marks}</td>

                <td>

                    <button
                        onclick="deleteStudent(${student.id})">

                        Delete

                    </button>

                </td>

            `;


                tableBody.appendChild(row);

            });

        }

        catch (error) {

            console.error(error);

        }

    }



    // ==================================
    // DELETE STUDENT
    // ==================================

    async function deleteStudent(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this student?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/students/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            const result =
                await response.text();


            alert(result);

            loadStudents();
        }

        catch (error) {

            console.error(error);

            alert(
                "Something went wrong while deleting."
            );

        }

    }



    // ==================================
    // SEARCH STUDENT
    // ==================================

    async function searchStudent() {

        const id =
            document.getElementById("searchId").value;

        const result =
            document.getElementById("searchResult");


        if (id === "") {

            result.textContent =
                "Please enter Student ID.";

            return;

        }


        try {

            const response =
                await fetch(
                    `/students/search?id=${id}`
                );


            if (response.ok) {

                const student =
                    await response.json();


                result.innerHTML = `

                <h3>Student Found</h3>

                <p>
                    <strong>ID:</strong>
                    ${student.id}
                </p>

                <p>
                    <strong>Name:</strong>
                    ${student.name}
                </p>

                <p>
                    <strong>Age:</strong>
                    ${student.age}
                </p>

                <p>
                    <strong>Course:</strong>
                    ${student.course}
                </p>

                <p>
                    <strong>Marks:</strong>
                    ${student.marks}
                </p>

            `;

            }

            else {

                result.textContent =
                    "Student not found.";

            }

        }

        catch (error) {

            console.error(error);

            result.textContent =
                "Something went wrong.";

        }

    }



    // ==================================
    // UPDATE STUDENT
    // ==================================

    async function updateStudent() {

        const id =
            document.getElementById("updateId").value;

        const name =
            document.getElementById("updateName").value;

        const age =
            document.getElementById("updateAge").value;

        const course =
            document.getElementById("updateCourse").value;

        const marks =
            document.getElementById("updateMarks").value;

        const message =
            document.getElementById("updateMessage");


        if (
            id === "" ||
            name === "" ||
            age === "" ||
            course === "" ||
            marks === ""
        ) {

            message.textContent =
                "Please fill all fields.";

            return;

        }


        const updatedStudent = {

            id: Number(id),

            name: name,

            age: Number(age),

            course: course,

            marks: Number(marks)

        };


        try {

            const response =
                await fetch(
                    `/students/${id}`,
                    {

                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(updatedStudent)

                    }
                );


            if (response.ok) {

                message.textContent =
                    "Student updated successfully!";

                loadStudents();

            }

            else {

                message.textContent =
                    "Update failed. HTTP Status: " + response.status;

            }

        }

        catch (error) {

            console.error(error);

            message.textContent =
                "Something went wrong.";

        }

    }


</script>

</body>

</html>
